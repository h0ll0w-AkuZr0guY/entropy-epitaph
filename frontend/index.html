<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熵逝碑林 · Entropy Epitaph</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SVG noise filter used by the CSS decay style -->
    <svg class="svg-defs">
      <filter id="entropy-noise">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.65"
          numOctaves="3"
          stitchTiles="stitch"
        />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
